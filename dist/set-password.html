<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087443">
  <meta name="robots" content="noindex, nofollow">
  <title>Atur Kata Sandi — CSSMoRA UNAIR</title>
  <link rel="icon" type="image/png" href="./assets/cssmora-logo.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./admin.css">
  <script src="./supabase-config.js" defer></script>
  <script src="./set-password.js" defer></script>
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="Kembali ke Jelajah Lomba CSSMoRA">
        <img class="brand-logo" src="./assets/cssmora-logo.png" alt="" width="58" height="58">
        <span class="brand-copy"><strong>CSSMoRA <i>UNAIR</i></strong></span>
      </a>
      <a class="header-action" href="./admin.html">Masuk <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main class="admin-main wrap">
    <section class="auth-card" aria-labelledby="password-title">
      <p class="auth-kicker">KEAMANAN AKUN</p>
      <h1 id="password-title">Atur kata sandi</h1>
      <p class="auth-help" id="password-help">Masukkan email akun admin. Kami akan mengirim tautan untuk membuat atau mengatur ulang kata sandi.</p>
      <form id="recovery-form">
        <label for="recovery-email">Email</label>
        <input id="recovery-email" name="email" type="email" autocomplete="email" required>
        <button class="admin-button" id="recovery-submit" type="submit">Kirim tautan <span aria-hidden="true">↗</span></button>
      </form>
      <form id="password-form" hidden>
        <label for="new-password">Kata sandi baru</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm-password">Ulangi kata sandi</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button class="admin-button" id="password-submit" type="submit">Simpan kata sandi <span aria-hidden="true">↗</span></button>
      </form>
      <p class="form-message" id="password-message" role="status" aria-live="polite"></p>
      <a class="text-button password-help" id="login-link" href="./admin.html">Kembali ke login</a>
    </section>
  </main>
</body>
</html>
