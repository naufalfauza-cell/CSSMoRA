<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087443">
  <meta name="description" content="Jelajahi informasi perlombaan CSSMoRA UNAIR. Cek poster, biaya, tenggat, dan tautan pendaftaran resmi.">
  <title>Info Lomba — CSSMoRA UNAIR</title>
  <link rel="icon" type="image/png" href="./assets/cssmora-logo.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./portal-ui.css?v=20261022-outfit-fonts">
  <script src="./supabase-config.js" defer></script>
  <script src="./app.js?v=20261022-detail-page" defer></script>
  <link rel="stylesheet" href="./ui-refresh.css?v=20261022-soft-ui">
</head>
<body class="catalog-page">
  <a class="skip" href="#catalog-page">Langsung ke katalog lomba</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="Beranda CSSMoRA UNAIR">
        <img class="brand-logo" src="./assets/cssmora-logo.png" alt="" width="58" height="58">
        <span class="brand-copy"><strong>CSSMoRA <i>UNAIR</i></strong></span>
      </a>
      <nav class="portal-nav" aria-label="Navigasi utama">
        <a href="./">Beranda</a>
        <a href="./lomba.html" aria-current="page">Info lomba</a>
        <a class="portal-nav-admin" href="./admin.html">Masuk pengurus <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="catalog-section" id="catalog-page" aria-labelledby="catalog-title">
      <div class="wrap">
        <div class="catalog-heading">
          <div><h1 id="catalog-title">Info lomba</h1></div>
        </div>
        <div class="catalog-status" id="data-status" role="status" aria-live="polite" hidden><p></p></div>
        <div class="catalog-controls">
        <div class="toolbar" role="search">
          <label class="search-box"><span class="sr-only">Cari nama atau penyelenggara lomba</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Cari nama lomba atau penyelenggara…" autocomplete="off"></label>
          <label class="select-wrap"><span class="sr-only">Filter bidang</span><select id="category"><option value="all">Semua bidang</option><option value="Esai & Riset">Esai & Riset</option><option value="Bisnis & Inovasi">Bisnis & Inovasi</option><option value="Desain & Media">Desain & Media</option><option value="Debat & Public Speaking">Debat & Public Speaking</option></select></label>
          <label class="select-wrap"><span class="sr-only">Filter status</span><select id="status"><option value="all">Semua status</option><option value="open">Masih dibuka</option><option value="closed">Sudah ditutup</option></select></label>
        </div>
        <div class="results-line"><span id="result-count" aria-live="polite"></span></div>
        </div>
        <div class="competition-grid" id="competition-grid"></div>
        <div class="empty-state" id="empty-state" hidden><span aria-hidden="true">✦</span><h3 id="empty-title">Belum ada lomba</h3><p id="empty-hint" hidden>Coba kata kunci atau filter lain.</p><button id="reset-filter" type="button">Atur ulang filter</button></div>
      </div>
    </section>
    <section class="competition-detail-page wrap" id="competition-detail-page" aria-label="Informasi lomba" hidden>
      <a class="detail-back" id="detail-back" href="./lomba.html">← Kembali ke semua lomba</a>
      <div id="detail-content" class="detail-page-grid"></div>
    </section>

  </main>
</body>
</html>
