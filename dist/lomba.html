<body class="catalog-page">

  <main>
    <section class="catalog-section" id="catalog-page" aria-labelledby="catalog-title">

        <div class="catalog-heading">
          <div><h1 id="catalog-title">Info lomba</h1></div>
        </div>
        <div class="catalog-status" id="data-status" role="status" aria-live="polite" hidden><p></p></div>
        <div class="catalog-controls">
        <div class="toolbar" role="search">
          <label class="search-box"><span class="sr-only">Cari nama atau penyelenggara lomba</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Cari nama lomba atau penyelenggara…" autocomplete="off"></label>
          <label class="select-wrap"><span class="sr-only">Filter bidang</span><select id="category"><option value="all">Semua bidang</option><option value="Esai & Riset">Esai & Riset</option><option value="Bisnis & Inovasi">Bisnis & Inovasi</option><option value="Desain & Media">Desain & Media</option><option value="Debat & Public Speaking">Debat & Public Speaking</option></select></label>

        </div>
        <div class="results-line"><span id="result-count" aria-live="polite"></span></div>
        </div>
        <div class="competition-grid" id="competition-grid"></div>
        <div class="empty-state" id="empty-state" hidden><span aria-hidden="true">✦</span><h3 id="empty-title">Belum ada lomba</h3><p id="empty-hint" hidden>Coba kata kunci atau filter lain.</p><button id="reset-filter" type="button">Atur ulang filter</button></div>
      </div>

    <section class="competition-detail-page wrap" id="competition-detail-page" aria-label="Informasi lomba" hidden>
      <a class="detail-back" id="detail-back" href="./lomba.html">← Kembali ke semua lomba</a>
      <div id="detail-content" class="detail-page-grid"></div>
    </section>
