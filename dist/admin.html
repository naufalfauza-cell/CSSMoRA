<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087443">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Lomba — CSSMoRA UNAIR</title>
  <link rel="icon" type="image/png" href="./assets/cssmora-logo.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./admin.css">
  <script src="./supabase-config.js" defer></script>
  <script src="./admin.js" defer></script>
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="Kembali ke beranda CSSMoRA UNAIR">
        <img class="brand-logo" src="./assets/cssmora-logo.png" alt="" width="58" height="58">
        <span class="brand-copy"><strong>CSSMoRA <i>UNAIR</i></strong></span>
      </a>
      <a class="header-action" href="./lomba.html">Katalog <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main class="admin-main wrap">
    <section class="auth-card" id="auth-view" aria-labelledby="auth-title">
      <h1 id="auth-title">Masuk</h1>
      <form id="auth-form">
        <label for="admin-email">Email</label>
        <input id="admin-email" name="email" type="email" autocomplete="username" required>
        <label for="admin-password">Kata sandi</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        <button class="admin-button" id="auth-submit" type="submit">Masuk <span aria-hidden="true">↗</span></button>
      </form>
      <a class="text-button password-help" href="./set-password.html">Atur / lupa kata sandi</a>
      <p class="form-message" id="auth-message" role="status" aria-live="polite"></p>
    </section>

    <section class="admin-dashboard" id="admin-view" hidden aria-labelledby="dashboard-title">
      <div class="dashboard-top">
        <div><span class="overline">DASHBOARD PENGURUS</span><h2 id="dashboard-title">Katalog lomba</h2><p id="signed-in-as"></p></div>
        <button class="text-button" id="logout" type="button">Keluar</button>
      </div>
      <div class="admin-columns">
        <section class="editor-card" aria-labelledby="editor-title">
          <div class="editor-heading"><div><span class="admin-kicker">FORM LOMBA</span><h3 id="editor-title">Tambah lomba</h3></div><button class="text-button" id="form-reset" type="button">Kosongkan</button></div>
          <form id="competition-form">
            <input id="record-id" name="recordId" type="hidden">
            <label for="title">Nama lomba</label><input id="title" name="title" maxlength="120" required>
            <label for="subtitle">Nama program / subjudul</label><input id="subtitle" name="subtitle" maxlength="160">
            <div class="form-two"><div><label for="category">Bidang</label><select id="category" name="category" required><option>Esai &amp; Riset</option><option>Bisnis &amp; Inovasi</option><option>Desain &amp; Media</option><option>Debat &amp; Public Speaking</option></select></div><div><label for="organizer">Penyelenggara</label><input id="organizer" name="organizer" maxlength="160" required></div></div>
            <div class="form-two"><div><label for="deadline">Batas pendaftaran</label><input id="deadline" name="deadline" type="date" required></div><div><label for="fee">Biaya pendaftaran</label><input id="fee" name="fee" placeholder="Gratis / Rp50.000 per tim" maxlength="80" required></div></div>
            <label for="poster">Tautan poster (opsional)</label><input id="poster" name="poster" type="url" placeholder="https://…">
            <label for="registration">Tautan pendaftaran resmi</label><input id="registration" name="registration" type="url" placeholder="https://…">
            <label for="description">Deskripsi dan catatan</label><textarea id="description" name="description" rows="4" maxlength="1200"></textarea>
            <label class="publish-toggle"><input id="published" name="published" type="checkbox"><span><strong>Terbitkan sekarang</strong><small>Lomba berstatus draft hanya terlihat oleh admin.</small></span></label>
            <button class="admin-button" id="save-competition" type="submit">Simpan lomba <span aria-hidden="true">↗</span></button>
            <p class="form-message" id="editor-message" role="status" aria-live="polite"></p>
          </form>
        </section>
        <section class="records-card" aria-labelledby="records-title">
          <div class="editor-heading"><div><span class="admin-kicker">DATA SUPABASE</span><h3 id="records-title">Lomba tersimpan</h3></div><span class="record-count" id="record-count">—</span></div>
          <div class="record-list" id="record-list"><p class="records-empty">Memuat data…</p></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
