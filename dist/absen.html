<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#076caa">
  <meta name="robots" content="noindex, nofollow">
  <title>Absensi Anggota · CSSMoRA UNAIR</title>
  <link rel="icon" type="image/png" href="./assets/cssmora-logo.png?v=20261023-perf-assets">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./absen.css?v=20261021-photo24h">
  <script src="./supabase-config.js?v=20261023-performance-v1" defer></script>
  <script src="./absen.js?v=20261023-performance-v1" defer></script>
  <link rel="stylesheet" href="./ui-refresh.css?v=20261022-soft-ui">
  <link rel="stylesheet" href="./wallet-theme.css?v=20261103-preview">
</head>
<body class="checkin-page">
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="./" aria-label="Kembali ke beranda CSSMoRA UNAIR">
      <img class="brand-logo" src="./assets/cssmora-logo.webp?v=20261023-perf-assets" alt="" width="52" height="52">
      <span class="brand-copy"><strong>CSSMoRA <i>UNAIR</i></strong></span>
    </a>
    <span class="checkin-label">ABSENSI ANGGOTA</span>
  </div></header>
  <main class="checkin-wrap">
    <section class="checkin-card" aria-labelledby="checkin-title">
      <span class="flow-emblem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4v5c0 4.6-5 7.6-8 9-3-1.4-8-4.4-8-9V7l8-4Z"/><path d="m8.5 12 2.3 2.3 4.7-4.8"/></svg></span>
      <span class="admin-kicker">CSSMoRA UNAIR</span>
      <h1 id="checkin-title">Absensi anggota</h1>
      <p id="event-meta" class="checkin-meta"></p>
      <label id="event-picker-label" for="event-select" hidden>Kegiatan aktif</label>
      <select id="event-select" hidden aria-label="Pilih kegiatan aktif"></select>
      <p class="form-message" id="checkin-message" role="status" aria-live="polite">Memeriksa kegiatan aktif…</p>
      <form id="checkin-form" hidden>
        <label for="checkin-cohort">Angkatan</label>
        <select id="checkin-cohort" name="cohort" required disabled><option value="">Pilih angkatan</option></select>
        <label for="checkin-program">Program studi</label>
        <select id="checkin-program" name="study_program" required disabled><option value="">Pilih prodi</option></select>
        <label for="checkin-member">Nama</label>
        <select id="checkin-member" name="member_id" required disabled><option value="">Pilih nama</option></select>
        <label for="checkin-photo">Foto bukti kehadiran</label>
        <input id="checkin-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required aria-describedby="checkin-photo-hint">
        <small class="checkin-photo-hint" id="checkin-photo-hint">Foto dikompres otomatis di perangkat, maksimal 500 KB.</small>
        <div class="checkin-photo-preview" id="photo-preview" hidden>
          <img id="photo-preview-image" alt="Pratinjau foto bukti kehadiran">
          <span id="photo-size"></span>
        </div>
        <button class="admin-button" id="checkin-submit" type="submit">Catat kehadiran <span aria-hidden="true">↗</span></button>
      </form>
      <p class="checkin-footnote">Foto hanya bisa dikirim saat kegiatan dibuka.</p>
    </section>
  </main>

  <nav class="wallet-bottom-nav" aria-label="Navigasi cepat CSSMoRA">
    <a href="./" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg><span>Beranda</span></a>
    <a href="./lomba.html" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v3a4 4 0 0 1-8 0V4ZM8 5H4v3a5 5 0 0 0 5 5m7-8h4v3a5 5 0 0 1-5 5M12 11v5m-4 4h8"/></svg><span>Lomba</span></a>
    <a href="./agenda.html" class="wallet-bottom-center " ><span class="wallet-bottom-center-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg></span><span>Agenda</span></a>
    <a href="./prestasi.html" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 6 1-4.4 4 1.1 6.5L12 17l-5.7 2.5L7.4 13 3 9l6-1z"/></svg><span>Prestasi</span></a>
    <a href="./admin.html" ><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Pengurus</span></a>
  </nav>
</body>
</html>
