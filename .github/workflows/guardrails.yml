name: Project guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run locked-behavior regression tests
        run: node --test tests/agenda.test.cjs tests/known-audit-regressions.cjs tests/rescreen-regressions.cjs tests/project-guardrails.test.cjs tests/subsidy-policy.test.cjs
